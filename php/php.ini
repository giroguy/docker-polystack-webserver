; OPcache — caches compiled PHP so WordPress files aren't read from disk on every request
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
opcache.revalidate_freq=60
opcache.fast_shutdown=1

; Errors — never print them into pages (they leak server paths); send them to `docker logs php-fpm` instead
display_errors=Off
display_startup_errors=Off
log_errors=On
