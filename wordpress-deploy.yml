# .github/workflows/deploy.yml
# Copy this to each WordPress site repo

name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd /srv/server/wordpress/YOUR_SITE_NAME
            git pull origin master
